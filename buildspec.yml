version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - cd app
      - npm install
      - cd ..

  build:
    commands:
      - echo "Packaging app for deployment..."
      - ls -lah
      - pwd

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - app/**/*
  discard-paths: no
